global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: course-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8080]
  - job_name: course-worker
    metrics_path: /metrics
    static_configs:
      - targets: [worker:8080]
