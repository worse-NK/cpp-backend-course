name: course-service-workshop

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: course_tasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 lab.py init first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run python3 lab.py init first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      # PostgreSQL 18+ stores a versioned PGDATA below this directory.
      - pgdata:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
      - ./schema.sql:/opt/course/schema.sql:ro
    healthcheck:
      # The temporary bootstrap server accepts only Unix sockets. Checking TCP
      # avoids reporting healthy before roles and schema have been initialized.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "course_tasks"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    networks:
      - backend
    # No ports: the database is reachable only on the backend network.

  app:
    build:
      context: .
    restart: unless-stopped
    init: true
    user: "65532:65532"
    environment:
      APP_BIND: 0.0.0.0
      APP_PORT: "8080"
      APP_STORAGE: postgres
      APP_TOKEN: ${APP_TOKEN:?Run python3 lab.py init first}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: course_tasks
      PGUSER: course_app
      PGPASSWORD: ${APP_DB_PASSWORD:?Run python3 lab.py init first}
      PGCONNECT_TIMEOUT: "2"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    networks:
      - backend
      - edge

volumes:
  pgdata:

networks:
  backend:
    internal: true
  # A second bridge preserves the app's loopback-published port; Caddy also
  # needs external connectivity for ACME. Database never joins this network.
  edge:
