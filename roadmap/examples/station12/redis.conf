# This configuration is only for the isolated course12 Compose project.
bind 0.0.0.0
protected-mode yes
port 6379
aclfile /usr/local/etc/redis/users.acl
dir /data
appendonly yes
appendfsync everysec
save 60 100
maxmemory 64mb
maxmemory-policy noeviction
slowlog-log-slower-than 10000
slowlog-max-len 64
latency-monitor-threshold 100
